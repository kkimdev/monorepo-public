name: chromeos-dev-setup

on:
  push:
    branches: [main]
    paths:
      - chromeos-dev-setup/**
      - nixpkgs/kakaotalk/**
      - .github/workflows/chromeos-dev-setup.yml
  pull_request:
    paths:
      - chromeos-dev-setup/**
      - nixpkgs/kakaotalk/**
      - .github/workflows/chromeos-dev-setup.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Unit tests
        run: |
          python3 -m unittest discover -s chromeos-dev-setup/tests -p 'test_*.py'
          python3 -m unittest discover -s nixpkgs/kakaotalk/tests -p 'test_*.py'
      # The example host data in chromeos-dev-setup/host-example keeps this pure.
      - name: Evaluate the Home Manager configuration
        run: >
          nix eval --accept-flake-config --raw
          "git+file://$GITHUB_WORKSPACE?dir=chromeos-dev-setup#homeConfigurations.ci.activationPackage.drvPath"
      - name: Build the system package and the cros CLI
        run: >
          nix build --accept-flake-config --no-link --print-out-paths
          "git+file://$GITHUB_WORKSPACE?dir=chromeos-dev-setup#system-deb"
          "git+file://$GITHUB_WORKSPACE?dir=chromeos-dev-setup#cros"
